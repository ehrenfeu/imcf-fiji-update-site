name: IMCF Fiji Assembly 🏗️

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual trigger"

jobs:

  set-common-variables:
    name: 👷🏼 Prepare workflow run
    runs-on: ubuntu-latest
    steps:

      - name: 🧮 Set variables common for all jobs
        shell: bash
        run: |
          CURRENT_DATE=$(date +%Y-%m-%d)
          CURRENT_TIME=$(date +%H-%M)
          CURRENT_TIME_H="$(echo $CURRENT_TIME | sed 's/-/:/')"
          TIMESTAMP="${CURRENT_DATE}--${CURRENT_TIME}"
          echo "
          CURRENT_DATE=$CURRENT_DATE
          CURRENT_TIME=$CURRENT_TIME
          TIMESTAMP=$TIMESTAMP
          RELEASE_TAG=v${TIMESTAMP}
          RELEASE_NAME=${CURRENT_DATE} ${CURRENT_TIME_H}
          " >> $GITHUB_OUTPUT

          cat $GITHUB_OUTPUT

